
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Sphere</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        h1 {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 100;
            font-size: 2em;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Celestial Sphere</h1>
    <canvas id="starfield"></canvas>
    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        const stars = [];
        const numStars = 500;

        function initStars() {
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.8 + 0.2,
                    dx: (Math.random() - 0.5) * 0.1,
                    dy: (Math.random() - 0.5) * 0.1,
                    alphaChange: (Math.random() - 0.5) * 0.01
                });
            }
        }

        function drawStars() {
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            }
        }

        function updateStars() {
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                star.x += star.dx;
                star.y += star.dy;

                star.alpha += star.alphaChange;
                if (star.alpha <= 0.1 || star.alpha >= 1) {
                    star.alphaChange *= -1;
                }

                if (star.x < -star.radius) star.x = width + star.radius;
                if (star.x > width + star.radius) star.x = -star.radius;
                if (star.y < -star.radius) star.y = height + star.radius;
                if (star.y > height + star.radius) star.y = -star.radius;
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            drawStars();
            updateStars();
            requestAnimationFrame(animate);
        }

        initStars();
        animate();
    </script>
</body>
</html>
